bio: |
  I am an Earth Observation and GeoAI Scientist working on remote sensing, machine learning, 
  and geospatial analysis for agricultural and environmental applications. 
  My research focuses on multimodal Earth observation data, crop monitoring, 
  yield prediction, hyperspectral analysis, and interpretable AI for geospatial problems.

